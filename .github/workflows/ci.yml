name: CI

on:
  pull_request:
  push:
    branches:
      - claude/shop-website-builder-payj8x

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! output="$(npx tsc --noEmit 2>&1)"; then
            description="${output//      - run: npm test
\\n'/ }"
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \\
              -f state=failure \\
              -f context="TypeScript diagnostic" \\
              -f description="${description:0:140}"
            printf '%s\\n' "$output"
            exit 1
          fi
      - run: npm test
