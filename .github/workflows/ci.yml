name: CI

on:
  pull_request:
  push:
    branches:
      - claude/shop-website-builder-payj8x

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: |
          if ! output="$(npx tsc --noEmit 2>&1)"; then
            printf '\`\`\`text\\n%s\\n\`\`\`\\n' "$output" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\\n' "$output"
            exit 1
          fi
      - run: npm test
